name: daily-digest

on:
  schedule:
    # 07:05 北京时间 = 前一天 23:05 UTC
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund

      - name: gen-daily
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          XIAOMI_TOKEN_PLAN_CN_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_CN_API_KEY }}
          TZ: Asia/Shanghai
        run: npx tsx src/server/cli/generate-daily.ts

      - name: export
        run: npx tsx scripts/export-today.ts

      - name: prune
        env:
          KEEP_DAYS: "30"
        run: npx tsx scripts/prune-exports.ts

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-window-${{ github.run_id }}
          path: data/exports/
          retention-days: 14

      - name: publish-site
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data/exports/site
          git init -q
          git config user.name "my-window"
          git config user.email "my-window@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(date -u +%F)" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
