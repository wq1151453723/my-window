name: my-window

services:
  window:
    build: .
    image: my-window:latest
    container_name: my-window
    restart: unless-stopped
    ports:
      - "${PORT:-4399}:4399"
    environment:
      TZ: Asia/Shanghai
      PORT: "4399"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_CN_API_KEY: "${MINIMAX_CN_API_KEY:-}"
      XIAOMI_TOKEN_PLAN_CN_API_KEY: "${XIAOMI_TOKEN_PLAN_CN_API_KEY:-}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
    volumes:
      - window-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4399/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    image: my-window:latest
    container_name: my-window-cron
    restart: unless-stopped
    depends_on:
      - window
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      RUN_AT: "${RUN_AT:-07:05}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_CN_API_KEY: "${MINIMAX_CN_API_KEY:-}"
      XIAOMI_TOKEN_PLAN_CN_API_KEY: "${XIAOMI_TOKEN_PLAN_CN_API_KEY:-}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
    volumes:
      - window-data:/app/data
    command: ["node", "scripts/cron-loop.mjs"]

volumes:
  window-data: